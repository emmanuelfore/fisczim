<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Viewport: prevent iOS auto-zoom on inputs -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />

  <title></title>
  <meta name="description"
    content="Tax-compliant invoicing and Point of Sale for African businesses. Issue fiscal receipts, manage inventory, and operate offline." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <!-- Theme Color (matches Dark Cybertheme slate-900) -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="msapplication-TileColor" content="#0f172a" />

  <!-- Open Graph (for sharing links) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FiscalStack — Tax Invoicing" />
  <meta property="og:description" content="Tax-compliant invoicing & POS for African businesses" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>html, body { margin: 0; padding: 0; background: #0f172a; }</style>
</head>

<body>
  <!-- React renders directly into the root. Do not place a progress overlay
       here: an HTML splash can outlive React and look permanently complete. -->
  <div id="root"></div>
  <script>
    // Vite transforms /src/main.tsx only when this document is served over
    // HTTP. Opening index.html with file:// otherwise leaves a blank dark page.
    if (window.location.protocol === "file:") {
      document.getElementById("root").innerHTML =
        '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#e2e8f0;font:16px system-ui;text-align:center"><div><h1 style="margin:0 0 12px">Start the app from its dev server</h1><p style="margin:0">Run <code>npm run dev</code>, then open <code>http://localhost:5001</code>.</p></div></main>';
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
