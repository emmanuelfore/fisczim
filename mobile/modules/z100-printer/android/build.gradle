plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.z100printer'
version = '0.7.10'

android {
  namespace "expo.modules.z100printer"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
  packagingOptions {
    // Handle the 100+ native libraries in the "Kitchen Sink" bundle
    pickFirst 'lib/*.so'
    pickFirst 'lib/*/*.so'
    pickFirst '**/*.so'
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}

dependencies {
  implementation files('libs/PosApiSdk.jar')
  implementation 'com.google.zxing:core:3.5.3'
}
