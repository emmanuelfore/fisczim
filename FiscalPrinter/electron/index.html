<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FiscalPrinter</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1a1a1a; }
    header { background: #0f3d2e; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 4px 0 0; opacity: 0.85; font-size: 13px; }
    main { padding: 16px 20px; display: grid; gap: 12px; }
    label { display: grid; gap: 4px; font-size: 13px; }
    input, select { padding: 8px 10px; border: 1px solid #c9d1d9; border-radius: 6px; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { background: #0f3d2e; color: #fff; border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; }
    button.secondary { background: #445; }
    #log { background: #111; color: #c6f6d5; font-family: ui-monospace, monospace; font-size: 12px; height: 220px; overflow: auto; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
    .hint { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>FiscalPrinter</h1>
    <p>Local app: capture print jobs → fiscalize → print QR receipt on your printer</p>
  </header>
  <main>
    <p class="hint">
      HTML is only used internally to lay out the fiscal receipt for the printer driver.
      Users never open HTML files — the app prints silently to the selected local printer.
    </p>
    <div class="row">
      <label>API key
        <input id="apiKey" type="password" placeholder="FiscalStack X-API-Key" />
      </label>
      <label>Local printer
        <select id="printerName"></select>
      </label>
    </div>
    <label>Spool folder (virtual printer / POS drops files here)
      <input id="spoolFolder" />
    </label>
    <label>Company name on receipt
      <input id="companyName" />
    </label>
    <div class="row">
      <button id="saveBtn">Save settings</button>
      <button id="refreshPrinters" class="secondary">Refresh printers</button>
    </div>
    <div id="log"></div>
  </main>
  <script>
    const logEl = document.getElementById('log');
    function addLog(line) {
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function loadPrinters(selected) {
      const printers = await window.fiscalPrinter.getPrinters();
      const sel = document.getElementById('printerName');
      sel.innerHTML = '<option value="">(fiscalize only — no print)</option>';
      for (const p of printers) {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + (p.isDefault ? ' (default)' : '');
        if (selected && selected === p.name) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    async function init() {
      const cfg = await window.fiscalPrinter.getConfig();
      document.getElementById('apiKey').value = cfg.apiKey || '';
      document.getElementById('spoolFolder').value = cfg.spoolFolder || '';
      document.getElementById('companyName').value = cfg.companyName || '';
      await loadPrinters(cfg.printerName);
      window.fiscalPrinter.onLog(addLog);
      window.fiscalPrinter.onJobDone((data) => {
        if (data.ok) addLog('Job done. QR/fiscal proof ready' + (data.printed ? ' and sent to printer.' : '.'));
        else addLog('Job failed: ' + data.error);
      });
      addLog('Ready. Watching spool folder.');
    }

    document.getElementById('saveBtn').onclick = async () => {
      await window.fiscalPrinter.saveConfig({
        apiKey: document.getElementById('apiKey').value.trim(),
        printerName: document.getElementById('printerName').value,
        spoolFolder: document.getElementById('spoolFolder').value.trim(),
        companyName: document.getElementById('companyName').value.trim(),
      });
      await window.fiscalPrinter.startWatch();
      addLog('Settings saved. Watcher restarted.');
    };

    document.getElementById('refreshPrinters').onclick = async () => {
      await loadPrinters(document.getElementById('printerName').value);
      addLog('Printer list refreshed.');
    };

    init();
  </script>
</body>
</html>
